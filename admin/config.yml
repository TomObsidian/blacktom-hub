  - name: "produits-black-boar"
    label: "Produits Black Boar"
    description: "Architecture prête pour le premier drop : aucun produit ici n'est affiché publiquement tant que les ventes ne sont pas activées."
    folder: "data/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Identifiant (slug)", name: "slug", widget: "string" }
      - label: "Type de produit"
        name: "productType"
        widget: "select"
        options: ["T-shirt", "Hoodie", "Casquette", "Accessoire", "Autre"]
      - { label: "Description courte", name: "shortDescription", widget: "string" }
      - { label: "Description complète", name: "description", widget: "text", required: false }
      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Prix", name: "price", widget: "number", required: false, value_type: "float" }
      - { label: "Prix précommande", name: "preorderPrice", widget: "number", required: false, value_type: "float" }
      - label: "Tailles disponibles"
        name: "sizes"
        widget: "list"
        required: false
        field: { label: "Taille", name: "size", widget: "string" }
      - { label: "Guide des tailles", name: "sizeGuide", widget: "text", required: false }
      - { label: "Stock", name: "stock", widget: "number", required: false, value_type: "int" }
      - label: "Statut"
        name: "status"
        widget: "select"
        default: "draft"
        options:
          - { label: "Brouillon", value: "draft" }
          - { label: "Teaser", value: "teaser" }
          - { label: "Bientôt disponible", value: "coming_soon" }
          - { label: "Accès prioritaire", value: "early_access" }
          - { label: "Précommande", value: "preorder" }
          - { label: "Disponible", value: "available" }
          - { label: "Épuisé", value: "sold_out" }
          - { label: "Archivé", value: "archived" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
      - { label: "Drop", name: "drop", widget: "string", default: "drop-01" }
      - { label: "Disponible à l'achat", name: "available", widget: "boolean", default: false }
      - { label: "Précommande activée", name: "preorderActive", widget: "boolean", default: false }
      - { label: "Date de sortie", name: "releaseDate", widget: "datetime", required: false }

  - name: "contenus"
    label: "Contenus (liste)"
    description: "La liste des articles/pages qui apparaît dans les hubs de contenu. Phase 1 : cette liste seulement, le texte complet d'un article se modifie encore dans le code pour l'instant."
    files:
      - file: "data/content.json"
        label: "Contenus"
        name: "content"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Phrase d'accroche", name: "tagline", widget: "string" }
          - label: "Articles, outils et pages"
            name: "content"
            widget: "list"
            summary: "{{title}} : {{status}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Type"
                name: "type"
                widget: "select"
                options: [{ label: "Article", value: "article" }, { label: "Outil", value: "outil" }, { label: "Page", value: "page" }, { label: "Page commerciale", value: "commercial" }, { label: "Article pilier", value: "pilier" }]
              - { label: "Catégorie (identifiant, vide si aucune)", name: "category", widget: "string", required: false }
              - { label: "Photo mise en avant", name: "image", widget: "image", required: false, hint: "Utilisée uniquement pour l'article pilier mis en avant sur la page Contenus. Laisser vide pour les autres." }
              - { label: "Photo version mobile (800 px)", name: "imageSmall", widget: "image", required: false }
              - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 35%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 35%"] }
              - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
              - label: "État"
                name: "status"
                widget: "select"
                options: [{ label: "Brouillon (masqué du site)", value: "planned" }, { label: "Publié", value: "published" }]
              - { label: "Adresse (URL) de la page, vide si brouillon", name: "url", widget: "string", required: false }
