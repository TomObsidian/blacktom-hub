# BLACKTOM Admin — configuration de l'interface de gestion du site.
backend:
  name: github
  repo: TomObsidian/blacktom-hub
  branch: main

# Où sont rangées les photos que tu ajoutes depuis l'admin.
media_folder: "/assets/uploads"
public_folder: "/assets/uploads"

# Aperçu avant publication.
publish_mode: editorial_workflow

locale: "fr"

collections:
  - name: "partenaires"
    label: "Partenaires"
    description: "Les marques partenaires affichées sur /partenaires et la home."
    files:
      - file: "data/partners.json"
        label: "Liste des partenaires"
        name: "partners"
        fields:
          - label: "Partenaires"
            name: "partners"
            widget: "list"
            summary: "{{name}} : {{offer}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Afficher ce partenaire", name: "active", widget: "boolean", default: true, hint: "Décoche pour retirer un partenaire sans supprimer ses données (historique, pages qui le référencent)." }
              - { label: "Catégorie", name: "category", widget: "string", required: false, hint: "Ex: Nutrition · Compléments, Vêtements d'entraînement." }
              - { label: "Mettre en avant", name: "featured", widget: "boolean", default: false, hint: "Passe ce partenaire en tête : c'est lui qui s'affiche en grand en haut de la page Codes promo, et en première ligne du tableau. À activer pour la marque qui te rapporte le plus (une seule en général)." }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Logo horizontal sur fond sombre, ratio 3:1 (ex. 240×80 px). Si ton logo a du texte noir, mets-le sur un fond sombre ou en version claire avant de l'envoyer." }
              - { label: "Description courte", name: "description", widget: "text", required: false }
              - { label: "Ce que j'utilise chez eux", name: "usage", widget: "text", required: false }
              - { label: "Mon avantage (ex: -10%)", name: "offer", widget: "string", required: false }
              - { label: "Code promo", name: "code", widget: "string", required: false }
              - { label: "Lien vers le partenaire", name: "url", widget: "string", required: false }
              - { label: "Ajouter des paramètres de suivi au lien", name: "utm", widget: "boolean", default: true, hint: "Désactiver seulement si le lien affilié ne doit jamais être modifié." }
              - { label: "Date de fin du partenariat", name: "expires", widget: "datetime", required: false, hint: "Laisser vide tant que le partenariat est actif. Une fois cette date passée, le code et le CTA disparaissent automatiquement. Le partenaire reste dans l'historique." }
              - { label: "Conditions de l'offre (affichées sous le code)", name: "conditions", widget: "string", required: false, hint: "Une phrase courte, uniquement si elle est vraie et que tu l'as vérifiée chez la marque. Ex: « Valable sur le site France, hors promotions déjà en cours. » Laisse vide plutôt que d'inventer." }
              - { label: "Code vérifié le", name: "checkedOn", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Date à laquelle tu as testé le code toi-même dans un panier. Affichée sous l'offre (« Code vérifié le … ») : c'est un signal de confiance, à renseigner seulement si c'est vrai, et à remettre à jour." }
              - { label: "Notes internes", name: "legal", widget: "text", required: false, hint: "Conditions particulières à te rappeler, non affichées publiquement." }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string", hint: "Utilisé en interne : ne change rien à l'affichage si tu le modifies par erreur, mais évite de le toucher." }

  - name: "complements"
    label: "Compléments"
    description: "La page /complements, un complément par ligne."
    files:
      - file: "data/supplements.json"
        label: "Compléments"
        name: "supplements"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom de la catégorie", name: "name", widget: "string" }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
          - label: "Compléments"
            name: "supplements"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Afficher ce complément", name: "active", widget: "boolean", default: true }
              - { label: "Catégorie", name: "category", widget: "string", hint: "Doit correspondre exactement à l'identifiant technique d'une catégorie ci-dessus." }
              - { label: "Ordre dans la catégorie", name: "order", widget: "number", default: 1 }
              - { label: "Explication générale", name: "general", widget: "text", required: false }
              - { label: "Mon utilisation personnelle", name: "personal", widget: "text", required: false, hint: "Laisser vide plutôt qu'inventer une raison." }
              - { label: "Moment de prise", name: "timing", widget: "string", required: false }
              - { label: "Dose personnelle", name: "dose", widget: "string", required: false }
              - { label: "Note courte", name: "note", widget: "string", required: false }
              - { label: "Marque", name: "brand", widget: "string", required: false }
              - { label: "Produit exact", name: "product", widget: "string", required: false }
              - { label: "Partenaire lié (identifiant)", name: "partnerSlug", widget: "string", required: false }
              - { label: "Code promo pour ce produit", name: "promoCode", widget: "string", required: false }
              - { label: "Lien affilié vers ce produit", name: "affiliateUrl", widget: "string", required: false }
              - { label: "Article BLACKTOM lié", name: "articleUrl", widget: "string", required: false }
              - { label: "Texte du lien vers l'article", name: "articleLinkText", widget: "string", required: false, hint: "Ex: En savoir plus sur la créatine →" }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }

  - name: "food-lab"
    label: "Food Lab"
    description: "La page /outils/convertisseur-cru-cuit, un aliment par ligne. Ratio = poids cuit / poids cru."
    files:
      - file: "data/food-lab.json"
        label: "Aliments Food Lab"
        name: "foodlab"
        fields:
          - label: "Aliments"
            name: "foods"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom affiché", name: "name", widget: "string" }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Ratio moyen (cuit / cru)", name: "ratio", widget: "number", value_type: "float", hint: "Ex : 2.5 pour un aliment qui double et demi de poids à la cuisson." }
              - { label: "Fourchette basse", name: "min", widget: "number", value_type: "float", required: false }
              - { label: "Fourchette haute", name: "max", widget: "number", value_type: "float", required: false }
              - { label: "Méthode de cuisson", name: "method", widget: "string", required: false }
              - { label: "Source", name: "source", widget: "text", required: false, hint: "Ne jamais inventer une source. Écrire clairement si c'est une estimation." }
              - { label: "Lien vers la source", name: "sourceUrl", widget: "string", required: false }
              - { label: "Note", name: "note", widget: "text", required: false }

  - name: "performances"
    label: "Mes performances"
    description: "Tes chiffres bench : modifiés ici une seule fois, répercutés partout sur le site."
    files:
      - file: "data/status.json"
        label: "Mes performances"
        name: "status"
        fields:
          - { label: "Poids de corps", name: "poids", widget: "string", required: false, hint: "Laisser vide tant que non renseigné : n'affiche jamais une fausse valeur." }
          - { label: "Meilleur développé couché", name: "developpe_couche", widget: "string", required: false }
          - { label: "Objectif actuel", name: "objectif", widget: "string", required: false }
          - { label: "Objectif long terme", name: "objectif_long_terme", widget: "string", required: false }
          - { label: "Prochaine compétition", name: "prochaine_competition", widget: "string", required: false }
          - { label: "Projet actuel", name: "projet_actuel", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    description: "La composition de chaque page : sections, ordre, visibilité. Utilise les flèches pour glisser une section, la corbeille pour la supprimer, l'icône de copie pour la dupliquer, et \"Ajouter\" pour choisir un nouveau type de section."
    files:
      - file: "data/pages/home.json"
        label: "Accueil"
        name: "home"
        fields:
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre (Hero)"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo", name: "image", widget: "image", hint: "Photo verticale (2:3), en couleur, noirs calés sur #0E0E0D, grain dans le fichier. Le visage doit rester visible. Voir scripts/registre-photos.py." }
                  - { label: "Photo version mobile (800 px)", name: "imageSmall", widget: "image", required: false, hint: "Facultatif : version plus légère de la même photo." }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 30%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30% (horizontal puis vertical). Plus le 2e chiffre est petit, plus on voit le haut de la photo."] }
                  - { label: "Titre (le mot géant, rogné en bas de la couverture)", name: "title", widget: "string" }
                  - { label: "Phrase d'accroche", name: "claim", widget: "string", required: false, hint: "Affichée en grand, en italique, à côté du portrait." }
                  - { label: "Sous-titre multiligne (ancien format)", name: "tagline", widget: "text", required: false, hint: "Un saut de ligne = une nouvelle ligne affichée. Laisser vide si la phrase d'accroche suffit." }
                  - { label: "Texte", name: "lede", widget: "string", required: false }
                  - { label: "Bouton : texte", name: "primaryCtaText", widget: "string" }
                  - { label: "Bouton : lien", name: "primaryCtaUrl", widget: "string" }
                  - { label: "Lien secondaire : texte", name: "secondaryCtaText", widget: "string", required: false }
                  - { label: "Lien secondaire : lien", name: "secondaryCtaUrl", widget: "string", required: false }
              - label: "Chiffre clé (ex: Bench)"
                name: "stat-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre de la section", name: "eyebrow", widget: "string", required: false, hint: "Ex : Le relevé" }
                  - { label: "Nom du premier chiffre", name: "title", widget: "string", required: false, hint: "Ex : Développé couché" }
                  - { label: "Légende du premier chiffre", name: "label", widget: "string", hint: "Ex : Meilleur résultat renseigné" }
                  - label: "Donnée à afficher"
                    name: "statKey"
                    widget: "select"
                    options:
                      - { label: "Poids de corps", value: "poids" }
                      - { label: "Meilleur développé couché", value: "developpe_couche" }
                    hint: "Vient de Mes performances. La section reste masquée tant que cette valeur est vide."
                  - label: "Objectif associé (facultatif)"
                    name: "goalKey"
                    widget: "select"
                    required: false
                    options:
                      - { label: "Objectif actuel", value: "objectif" }
                      - { label: "Objectif long terme", value: "objectif_long_terme" }
                  - { label: "Note de contexte (source du chiffre)", name: "note", widget: "text", required: false, hint: "Dis d'où vient le chiffre. Le poids de corps et le rapport (×1,8) sont calculés et affichés automatiquement à côté." }
                  - { label: "Lien : texte", name: "ctaText", widget: "string", required: false }
                  - { label: "Lien : adresse", name: "ctaUrl", widget: "string", required: false }
                  - { label: "Événement de suivi du lien (technique)", name: "ctaTrackEvent", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
              - label: "Journal (contenus mis en avant)"
                name: "contenus-teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Contenus mis en avant (le premier est affiché en grand)"
                    name: "items"
                    widget: "list"
                    summary: "{{title}}"
                    fields:
                      - { label: "Titre", name: "title", widget: "string" }
                      - { label: "Catégorie", name: "category", widget: "string" }
                      - { label: "Micro-description", name: "description", widget: "string", required: false }
                      - { label: "Lien", name: "url", widget: "string" }
                      - { label: "Texte du lien (premier élément seulement)", name: "linkText", widget: "string", required: false, hint: "Ex : Lire le dossier" }
                      - { label: "Photo", name: "image", widget: "image", hint: "Premier élément : bande 21:9 (2200 px de large). Les autres : carré (900 px). Voir scripts/registre-photos.py." }
                      - { label: "Photo version mobile", name: "imageSmall", widget: "image", required: false, hint: "Bande : 1000 px de large. Carré : 480 px." }
                      - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 30%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30%"] }
                      - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - { label: "Lien : texte", name: "ctaText", widget: "string" }
                  - { label: "Lien : adresse", name: "ctaUrl", widget: "string" }
              - label: "Outils (Bench Lab, Food Lab)"
                name: "tools-teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Outils"
                    name: "items"
                    widget: "list"
                    summary: "{{title}}"
                    fields:
                      - { label: "Petit titre de l'outil", name: "kicker", widget: "string", required: false }
                      - { label: "Nom", name: "title", widget: "string" }
                      - { label: "Texte", name: "text", widget: "text" }
                      - { label: "Grand chiffre (facultatif)", name: "bigValue", widget: "string", required: false, hint: "Ex : 116,7. Doit correspondre à ce que l'outil calcule réellement pour l'exemple ci-dessous." }
                      - { label: "Unité du grand chiffre", name: "bigUnit", widget: "string", required: false, hint: "Ex : kg ou g" }
                      - { label: "Exemple de résultat (facultatif)", name: "example", widget: "string", required: false, hint: "Doit correspondre à ce que l'outil calcule réellement." }
                      - label: "Illustration"
                        name: "visual"
                        widget: "select"
                        required: false
                        default: ""
                        options:
                          - { label: "Aucune", value: "" }
                          - { label: "Barre chargée (100 kg)", value: "barbell" }
                      - { label: "Bouton : texte", name: "ctaText", widget: "string" }
                      - { label: "Bouton : lien", name: "ctaUrl", widget: "string" }
                      - { label: "Identifiant de suivi (technique)", name: "trackId", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
              - label: "Bench Lab (accroche, ancien format)"
                name: "punch-cta"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche courte", name: "text", widget: "string" }
                  - { label: "Bouton : texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton : lien", name: "ctaUrl", widget: "string" }
              - label: "Newsletter"
                name: "newsletter"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string", required: false }
                  - { label: "Texte", name: "description", widget: "text" }
              - label: "Projets associés (Full Black, Black Boar, Ultimate Method)"
                name: "projects"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Projets"
                    name: "items"
                    widget: "list"
                    summary: "{{title}}"
                    fields:
                      - { name: "layout", widget: "hidden", default: "card", required: false }
                      - { label: "Petit titre", name: "kicker", widget: "string", required: false }
                      - { label: "Titre", name: "title", widget: "string" }
                      - { label: "Texte", name: "text", widget: "text" }
                      - { label: "Photo carrée (facultative)", name: "image", widget: "image", required: false, hint: "Carré 1000 px. Une photo d'ambiance ne doit jamais être présentée comme un article disponible." }
                      - { label: "Photo version mobile (560 px)", name: "imageSmall", widget: "image", required: false }
                      - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 30%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30%"] }
                      - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                      - { label: "Afficher le logo Black Boar", name: "showMark", widget: "boolean", default: false, required: false }
                      - { label: "Bouton : texte", name: "ctaText", widget: "string" }
                      - { label: "Bouton : lien", name: "ctaUrl", widget: "string" }
                      - { label: "Identifiant de suivi (technique)", name: "trackId", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
                      - { label: "Réseau social (technique)", name: "socialPlatform", widget: "string", required: false, hint: "Ex: instagram. Renseigné seulement si le lien mène à un réseau social." }
              - label: "Planche contact (photos N&B)"
                name: "contact-sheet"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string", required: false, hint: "Ex : lieu et date de la séance." }
                  - { label: "Titre", name: "title", widget: "string", default: "Planche contact" }
                  - { label: "Texte sous la planche", name: "text", widget: "text", required: false, hint: "Que des faits vérifiables (lieu, date, matériel). Pas de texte marketing." }
                  - { label: "Lien : texte", name: "ctaText", widget: "string", required: false }
                  - { label: "Lien : adresse", name: "ctaUrl", widget: "string", required: false }
                  - { label: "Identifiant de suivi (technique)", name: "trackId", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
                  - label: "Photos (8 conseillées)"
                    name: "photos"
                    widget: "list"
                    summary: "{{caption}}"
                    fields:
                      - { label: "Photo", name: "image", widget: "image", hint: "Format 4:5, 640 px de large." }
                      - { label: "Photo version mobile (400 px)", name: "imageSmall", widget: "image", required: false }
                      - { label: "Texte alternatif", name: "alt", widget: "string" }
                      - { label: "Légende", name: "caption", widget: "string", required: false, hint: "Réelle : nom du fichier, matériel, date. Rien d'inventé." }
              - label: "Section Partenaires"
                name: "partners-teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre", name: "subtitle", widget: "text", required: false, hint: "Les partenaires affichés viennent automatiquement de la collection Partenaires, rien à configurer ici." }
                  - { label: "Lien : texte", name: "ctaText", widget: "string" }
                  - { label: "Lien : adresse", name: "ctaUrl", widget: "string" }
              - label: "Bandeau À propos (Tom)"
                name: "about-strip"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string", required: false }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
                  - { label: "Photo", name: "image", widget: "image", required: false }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - { label: "Lien : texte", name: "ctaText", widget: "string" }
                  - { label: "Lien : adresse", name: "ctaUrl", widget: "string" }
                  - { label: "Identifiant de suivi (technique)", name: "trackId", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
              - label: "Texte + image (bloc découverte, ancien format)"
                name: "teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo (facultative)", name: "image", widget: "image", required: false }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - label: "Étiquettes"
                    name: "tags"
                    widget: "list"
                    required: false
                    field: { label: "Étiquette", name: "tag", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
                  - { label: "Bouton : texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton : lien", name: "ctaUrl", widget: "string" }

      - file: "data/pages/black-boar.json"
        label: "Black Boar"
        name: "black-boar"
        fields:
          - label: "Référencement (SEO)"
            name: "seoTitle"
            widget: "string"
          - label: "Description (SEO)"
            name: "seoDescription"
            widget: "text"
          - label: "Paramètres du drop"
            name: "dropSettings"
            widget: "object"
            fields:
              - { label: "Nom du drop", name: "name", widget: "string", hint: "Ex: DROP 01" }
              - label: "Statut du drop"
                name: "status"
                widget: "select"
                default: "waitlist"
                options:
                  - { label: "Brouillon (rien de visible)", value: "draft" }
                  - { label: "Liste prioritaire (early access)", value: "waitlist" }
                  - { label: "Précommande", value: "preorder" }
                  - { label: "Disponible", value: "available" }
                  - { label: "Épuisé", value: "sold_out" }
                  - { label: "Archivé", value: "archived" }
              - { label: "Afficher le formulaire de liste prioritaire", name: "waitlistEnabled", widget: "boolean", default: true }
              - { label: "Activer les précommandes", name: "preorderEnabled", widget: "boolean", default: false, hint: "Ne pas activer sans avoir validé les infos produit, prix, stock et paiement." }
              - { label: "Date d'accès prioritaire", name: "earlyAccessDate", widget: "datetime", required: false, hint: "Laisser vide tant que non décidée : n'affiche rien tant que vide." }
              - { label: "Date d'ouverture publique", name: "publicLaunchDate", widget: "datetime", required: false }
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre (Hero)"
                name: "bb-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo", name: "image", widget: "image", hint: "Photo d'ambiance : elle ne doit pas laisser croire à un article disponible." }
                  - { label: "Photo version mobile (800 px)", name: "imageSmall", widget: "image", required: false }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 30%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30% (horizontal puis vertical). Plus le 2e chiffre est petit, plus on voit le haut de la photo."] }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre (une ligne)", name: "tagline", widget: "string", required: false }
                  - { label: "Texte", name: "lede", widget: "text", required: false }
                  - { label: "Statut du projet (ex: pré-lancement)", name: "status", widget: "string", required: false, hint: "Dis honnêtement où en est la marque. N'annonce ni date, ni prix, ni stock sans les avoir validés." }
                  - { label: "Bouton : texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton : lien", name: "ctaUrl", widget: "string", hint: "Ex: #drop-form pour aller directement au formulaire." }
              - label: "Texte (univers de la marque)"
                name: "bb-text"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "text" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "text", required: false, hint: "Laisse une ligne vide entre deux paragraphes. Si ce champ est vide, le titre est affiché seul, en grand." }
                  - { label: "Photo (la section passe en deux moitiés)", name: "image", widget: "image", required: false, hint: "Portrait 2:3, 1100 px de large. Si ce champ est vide, la section reste en pleine largeur." }
                  - { label: "Photo version mobile (700 px)", name: "imageSmall", widget: "image", required: false }
                  - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 30%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30%"] }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
              - label: "Galerie de photos d'ambiance"
                name: "bb-gallery"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - label: "Photos"
                    name: "photos"
                    widget: "list"
                    summary: "{{alt}}"
                    fields:
                      - { label: "Photo", name: "image", widget: "image" }
                      - { label: "Photo version mobile (800 px)", name: "imageSmall", widget: "image", required: false }
                      - { label: "Cadrage de la photo", name: "position", widget: "string", required: false, default: "50% 35%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30%"] }
                      - { label: "Texte alternatif", name: "alt", widget: "string" }
                  - { label: "Mention sous la galerie", name: "note", widget: "string", required: false, hint: "Précise que ce sont des photos d'ambiance, pas des articles." }
              - label: "Premier drop (avec formulaire)"
                name: "bb-drop"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo d'ambiance (facultative, affichée en moitié de la section)", name: "image", widget: "image", required: false, hint: "Portrait, 1100 px de large." }
                  - { label: "Photo version mobile (700 px)", name: "imageSmall", widget: "image", required: false }
                  - { label: "Cadrage de la photo", name: "imagePosition", widget: "string", required: false, default: "50% 30%", pattern: ['^\d{1,3}% \d{1,3}%$', "Format attendu : 50% 30%"] }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - { label: "Petit titre", name: "eyebrow", widget: "string", required: false }
                  - { label: "Titre", name: "title", widget: "string", required: false }
                  - { label: "Texte", name: "text", widget: "text", required: false }
                  - { label: "Titre au-dessus du formulaire", name: "formTitle", widget: "string", required: false }
                  - { label: "Bouton : texte", name: "ctaText", widget: "string" }
                  - { label: "Texte de consentement (case à cocher)", name: "consentText", widget: "string", hint: "Ce texte doit rester spécifique au drop, ne pas le confondre avec la newsletter générale BLACKTOM." }

