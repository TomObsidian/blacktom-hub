# BLACKTOM Admin — configuration de l'interface de gestion du site.
backend:
  name: github
  repo: TomObsidian/blacktom-hub
  branch: main

# Où sont rangées les photos que tu ajoutes depuis l'admin.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Aperçu avant publication.
publish_mode: editorial_workflow

locale: "fr"

collections:
  - name: "partenaires"
    label: "Partenaires"
    description: "Les marques partenaires affichées sur /partenaires et la home."
    files:
      - file: "data/partners.json"
        label: "Liste des partenaires"
        name: "partners"
        fields:
          - label: "Partenaires"
            name: "partners"
            widget: "list"
            summary: "{{name}} — {{offer}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Afficher ce partenaire", name: "active", widget: "boolean", default: true, hint: "Décoche pour retirer un partenaire sans supprimer ses données (historique, pages qui le référencent)." }
              - { label: "Catégorie", name: "category", widget: "string", required: false, hint: "Ex: Nutrition · Compléments, Vêtements d'entraînement." }
              - { label: "Mettre en avant", name: "featured", widget: "boolean", default: false, hint: "Réservé à un usage futur (home, newsletter) — sans effet pour l'instant." }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Format carré recommandé." }
              - { label: "Description courte", name: "description", widget: "text", required: false }
              - { label: "Ce que j'utilise chez eux", name: "usage", widget: "text", required: false }
              - { label: "Mon avantage (ex: -10%)", name: "offer", widget: "string", required: false }
              - { label: "Code promo", name: "code", widget: "string", required: false }
              - { label: "Lien vers le partenaire", name: "url", widget: "string", required: false }
              - { label: "Ajouter des paramètres de suivi au lien", name: "utm", widget: "boolean", default: true, hint: "Désactiver seulement si le lien affilié ne doit jamais être modifié." }
              - { label: "Date de fin du partenariat", name: "expires", widget: "datetime", required: false, hint: "Laisser vide tant que le partenariat est actif. Une fois cette date passée, le code et le CTA disparaissent automatiquement — le partenaire reste dans l'historique." }
              - { label: "Notes internes", name: "legal", widget: "text", required: false, hint: "Conditions particulières à te rappeler — non affiché publiquement." }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string", hint: "Utilisé en interne — ne change rien à l'affichage si tu le modifies par erreur, mais évite de le toucher." }

  - name: "complements"
    label: "Compléments"
    description: "La page /complements — un complément par ligne."
    files:
      - file: "data/supplements.json"
        label: "Compléments"
        name: "supplements"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom de la catégorie", name: "name", widget: "string" }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
          - label: "Compléments"
            name: "supplements"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Afficher ce complément", name: "active", widget: "boolean", default: true }
              - { label: "Catégorie", name: "category", widget: "string", hint: "Doit correspondre exactement à l'identifiant technique d'une catégorie ci-dessus." }
              - { label: "Ordre dans la catégorie", name: "order", widget: "number", default: 1 }
              - { label: "Explication générale", name: "general", widget: "text", required: false }
              - { label: "Mon utilisation personnelle", name: "personal", widget: "text", required: false, hint: "Laisser vide plutôt qu'inventer une raison." }
              - { label: "Moment de prise", name: "timing", widget: "string", required: false }
              - { label: "Dose personnelle", name: "dose", widget: "string", required: false }
              - { label: "Note courte", name: "note", widget: "string", required: false }
              - { label: "Marque", name: "brand", widget: "string", required: false }
              - { label: "Produit exact", name: "product", widget: "string", required: false }
              - { label: "Partenaire lié (identifiant)", name: "partnerSlug", widget: "string", required: false }
              - { label: "Code promo pour ce produit", name: "promoCode", widget: "string", required: false }
              - { label: "Lien affilié vers ce produit", name: "affiliateUrl", widget: "string", required: false }
              - { label: "Article BLACKTOM lié", name: "articleUrl", widget: "string", required: false }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }

  - name: "performances"
    label: "Mes performances"
    description: "Tes chiffres bench — modifiés ici une seule fois, répercutés partout sur le site."
    files:
      - file: "data/status.json"
        label: "Mes performances"
        name: "status"
        fields:
          - { label: "Poids de corps", name: "poids", widget: "string", required: false, hint: "Laisser vide tant que non renseigné — n'affiche jamais une fausse valeur." }
          - { label: "Meilleur développé couché", name: "developpe_couche", widget: "string", required: false }
          - { label: "Objectif actuel", name: "objectif", widget: "string", required: false }
          - { label: "Objectif long terme", name: "objectif_long_terme", widget: "string", required: false }
          - { label: "Prochaine compétition", name: "prochaine_competition", widget: "string", required: false }
          - { label: "Projet actuel", name: "projet_actuel", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    description: "La composition de chaque page : sections, ordre, visibilité. Utilise les flèches pour glisser une section, la corbeille pour la supprimer, l'icône de copie pour la dupliquer, et \"Ajouter\" pour choisir un nouveau type de section."
    files:
      - file: "data/pages/home.json"
        label: "Accueil"
        name: "home"
        fields:
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre (Hero)"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo de fond", name: "image", widget: "image" }
                  - label: "Cadrage de la photo"
                    name: "imagePosition"
                    widget: "select"
                    default: "50% 50%"
                    options:
                      - { label: "Centre", value: "50% 50%" }
                      - { label: "Haut", value: "50% 15%" }
                      - { label: "Bas", value: "50% 85%" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre (une ligne par ligne de texte)", name: "tagline", widget: "text", hint: "Un saut de ligne = une nouvelle ligne affichée, pour un effet plus graphique." }
                  - { label: "Texte", name: "lede", widget: "string", required: false }
                  - { label: "Bouton — texte", name: "primaryCtaText", widget: "string" }
                  - { label: "Bouton — lien", name: "primaryCtaUrl", widget: "string" }
              - label: "Chiffre clé (ex: Bench)"
                name: "stat-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Label", name: "label", widget: "string", hint: "Ex: Bench" }
                  - label: "Donnée à afficher"
                    name: "statKey"
                    widget: "select"
                    options:
                      - { label: "Poids de corps", value: "poids" }
                      - { label: "Meilleur développé couché", value: "developpe_couche" }
                    hint: "Vient de Mes performances. La section reste masquée tant que cette valeur est vide."
                  - label: "Objectif associé (facultatif)"
                    name: "goalKey"
                    widget: "select"
                    required: false
                    options:
                      - { label: "Objectif actuel", value: "objectif" }
                      - { label: "Objectif long terme", value: "objectif_long_terme" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string", required: false }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string", required: false }
                  - { label: "Événement de suivi du bouton (technique)", name: "ctaTrackEvent", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
              - label: "Section Contenus (aperçus)"
                name: "contenus-teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - label: "Contenus mis en avant (3 maximum)"
                    name: "items"
                    widget: "list"
                    summary: "{{title}}"
                    fields:
                      - { label: "Titre", name: "title", widget: "string" }
                      - { label: "Catégorie", name: "category", widget: "string" }
                      - { label: "Lien", name: "url", widget: "string" }
                      - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string" }
              - label: "Bench Lab (accroche)"
                name: "punch-cta"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche courte", name: "text", widget: "string" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string" }
              - label: "Section Partenaires"
                name: "partners-teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string" }
              - label: "Texte + image (bloc découverte)"
                name: "teaser"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo (facultative)", name: "image", widget: "image", required: false }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - label: "Étiquettes"
                    name: "tags"
                    widget: "list"
                    required: false
                    field: { label: "Étiquette", name: "tag", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string" }
              - label: "Newsletter"
                name: "newsletter"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Texte", name: "description", widget: "text" }

      - file: "data/pages/black-boar.json"
        label: "Black Boar"
        name: "black-boar"
        fields:
          - label: "Référencement (SEO)"
            name: "seoTitle"
            widget: "string"
          - label: "Description (SEO)"
            name: "seoDescription"
            widget: "text"
          - label: "Paramètres du drop"
            name: "dropSettings"
            widget: "object"
            fields:
              - { label: "Nom du drop", name: "name", widget: "string", hint: "Ex: DROP 01" }
              - label: "Statut du drop"
                name: "status"
                widget: "select"
                default: "waitlist"
                options:
                  - { label: "Brouillon (rien de visible)", value: "draft" }
                  - { label: "Liste prioritaire (early access)", value: "waitlist" }
                  - { label: "Précommande", value: "preorder" }
                  - { label: "Disponible", value: "available" }
                  - { label: "Épuisé", value: "sold_out" }
                  - { label: "Archivé", value: "archived" }
              - { label: "Afficher le formulaire de liste prioritaire", name: "waitlistEnabled", widget: "boolean", default: true }
              - { label: "Activer les précommandes", name: "preorderEnabled", widget: "boolean", default: false, hint: "Ne pas activer sans avoir validé les infos produit, prix, stock et paiement." }
              - { label: "Date d'accès prioritaire", name: "earlyAccessDate", widget: "datetime", required: false, hint: "Laisser vide tant que non décidée — n'affiche rien tant que vide." }
              - { label: "Date d'ouverture publique", name: "publicLaunchDate", widget: "datetime", required: false }
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre (Hero)"
                name: "bb-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo de fond", name: "image", widget: "image" }
                  - label: "Cadrage de la photo"
                    name: "imagePosition"
                    widget: "select"
                    default: "50% 50%"
                    options:
                      - { label: "Centre", value: "50% 50%" }
                      - { label: "Haut", value: "50% 20%" }
                      - { label: "Bas", value: "50% 80%" }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "lede", widget: "text" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string", hint: "Ex: #drop-form pour aller directement au formulaire." }
              - label: "Texte simple"
                name: "bb-text"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre / texte", name: "title", widget: "text" }
              - label: "Premier drop (avec formulaire)"
                name: "bb-drop"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo d'ambiance (facultative)", name: "image", widget: "image", required: false }
                  - { label: "Texte alternatif de la photo", name: "imageAlt", widget: "string", required: false }
                  - { label: "Petit titre", name: "eyebrow", widget: "string", required: false }
                  - { label: "Titre", name: "title", widget: "string", required: false }
                  - { label: "Texte", name: "text", widget: "text", required: false }
                  - { label: "Titre au-dessus du formulaire", name: "formTitle", widget: "string", required: false }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Texte de consentement (case à cocher)", name: "consentText", widget: "string", hint: "Ce texte doit rester spécifique au drop, ne pas le confondre avec la newsletter générale BLACKTOM." }

      - file: "data/pages/a-propos.json"
        label: "À propos"
        name: "a-propos"
        fields:
          - { label: "Référencement (SEO)", name: "seoTitle", widget: "string" }
          - { label: "Description (SEO)", name: "seoDescription", widget: "text" }
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre avec photo (Hero)"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Photo de fond", name: "image", widget: "image" }
                  - label: "Cadrage de la photo"
                    name: "imagePosition"
                    widget: "select"
                    default: "50% 50%"
                    options:
                      - { label: "Centre", value: "50% 50%" }
                      - { label: "Haut", value: "50% 20%" }
                      - { label: "Bas", value: "50% 80%" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre (une ligne par ligne de texte)", name: "tagline", widget: "text", hint: "Un saut de ligne = une nouvelle ligne affichée." }
                  - { label: "Texte", name: "lede", widget: "string", required: false }
                  - { label: "Bouton — texte", name: "primaryCtaText", widget: "string", required: false }
                  - { label: "Bouton — lien", name: "primaryCtaUrl", widget: "string", required: false }
              - label: "Grand titre (Hero simple)"
                name: "simple-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre court", name: "tagline", widget: "string", required: false }
                  - { label: "Texte", name: "lede", widget: "text", required: false }
                  - { label: "Texte secondaire (petit, discret)", name: "subtext", widget: "text", required: false }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string", required: false }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string", required: false }
                  - { label: "Événement de suivi du bouton (technique)", name: "ctaTrackEvent", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
              - label: "Texte (titre + paragraphes)"
                name: "bio-text"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text", hint: "Laisse une ligne vide entre deux paragraphes." }
              - label: "Galerie de photos"
                name: "photo-gallery"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - label: "Photos"
                    name: "photos"
                    widget: "list"
                    summary: "{{caption}}"
                    fields:
                      - { label: "Photo", name: "image", widget: "image" }
                      - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
                      - { label: "Légende", name: "caption", widget: "string" }

      - file: "data/pages/ultimate-method.json"
        label: "The Ultimate Method"
        name: "ultimate-method"
        fields:
          - { label: "Référencement (SEO)", name: "seoTitle", widget: "string" }
          - { label: "Description (SEO)", name: "seoDescription", widget: "text" }
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre (Hero simple)"
                name: "simple-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre court", name: "tagline", widget: "string", required: false }
                  - { label: "Texte", name: "lede", widget: "text", required: false }
                  - { label: "Texte secondaire (petit, discret)", name: "subtext", widget: "text", required: false }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string", required: false }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string", required: false, hint: "L'app est hébergée séparément (black-tom.netlify.app) — lien réel, ne pas remplacer par une URL blacktom.fr." }
                  - { label: "Événement de suivi du bouton (technique)", name: "ctaTrackEvent", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }
              - label: "Trois points forts"
                name: "um-features"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - label: "Points forts (3 recommandés)"
                    name: "items"
                    widget: "list"
                    summary: "{{label}}"
                    fields:
                      - { label: "Titre", name: "label", widget: "string" }
                      - { label: "Description", name: "description", widget: "string" }
              - label: "Bandeau CTA"
                name: "cta-band"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "text", widget: "string" }
                  - { label: "Bouton — texte", name: "ctaText", widget: "string" }
                  - { label: "Bouton — lien", name: "ctaUrl", widget: "string" }
                  - { label: "Événement de suivi du bouton (technique)", name: "ctaTrackEvent", widget: "string", required: false, hint: "Ne pas modifier sauf demande technique." }

      - file: "data/pages/contenus.json"
        label: "Contenus (page d'accueil de la rubrique)"
        name: "contenus-page"
        fields:
          - { label: "Référencement (SEO)", name: "seoTitle", widget: "string" }
          - { label: "Description (SEO)", name: "seoDescription", widget: "text" }
          - label: "Sections de la page"
            name: "blocks"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.title}}"
            types:
              - label: "Grand titre (Hero simple)"
                name: "simple-hero"
                widget: "object"
                fields:
                  - { label: "Afficher cette section", name: "visible", widget: "boolean", default: true }
                  - { label: "Petit titre", name: "eyebrow", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Texte", name: "lede", widget: "text", required: false }

  - name: "produits-black-boar"
    label: "Produits Black Boar"
    description: "Architecture prête pour le premier drop — aucun produit ici n'est affiché publiquement tant que les ventes ne sont pas activées."
    folder: "data/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Identifiant (slug)", name: "slug", widget: "string" }
      - label: "Type de produit"
        name: "productType"
        widget: "select"
        options: ["T-shirt", "Hoodie", "Casquette", "Accessoire", "Autre"]
      - { label: "Description courte", name: "shortDescription", widget: "string" }
      - { label: "Description complète", name: "description", widget: "text", required: false }
      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Prix", name: "price", widget: "number", required: false, value_type: "float" }
      - { label: "Prix précommande", name: "preorderPrice", widget: "number", required: false, value_type: "float" }
      - label: "Tailles disponibles"
        name: "sizes"
        widget: "list"
        required: false
        field: { label: "Taille", name: "size", widget: "string" }
      - { label: "Guide des tailles", name: "sizeGuide", widget: "text", required: false }
      - { label: "Stock", name: "stock", widget: "number", required: false, value_type: "int" }
      - label: "Statut"
        name: "status"
        widget: "select"
        default: "draft"
        options:
          - { label: "Brouillon", value: "draft" }
          - { label: "Teaser", value: "teaser" }
          - { label: "Bientôt disponible", value: "coming_soon" }
          - { label: "Accès prioritaire", value: "early_access" }
          - { label: "Précommande", value: "preorder" }
          - { label: "Disponible", value: "available" }
          - { label: "Épuisé", value: "sold_out" }
          - { label: "Archivé", value: "archived" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1 }
      - { label: "Drop", name: "drop", widget: "string", default: "drop-01" }
      - { label: "Disponible à l'achat", name: "available", widget: "boolean", default: false }
      - { label: "Précommande activée", name: "preorderActive", widget: "boolean", default: false }
      - { label: "Date de sortie", name: "releaseDate", widget: "datetime", required: false }

  - name: "contenus"
    label: "Contenus (liste)"
    description: "La liste des articles/pages qui apparaît dans les hubs de contenu. Phase 1 : cette liste seulement — le texte complet d'un article se modifie encore dans le code pour l'instant."
    files:
      - file: "data/content.json"
        label: "Contenus"
        name: "content"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Identifiant technique (ne pas modifier)", name: "slug", widget: "string" }
              - { label: "Phrase d'accroche", name: "tagline", widget: "string" }
          - label: "Articles, outils et pages"
            name: "content"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Type"
                name: "type"
                widget: "select"
                options: [{ label: "Article", value: "article" }, { label: "Outil", value: "outil" }, { label: "Page", value: "page" }, { label: "Page commerciale", value: "commercial" }, { label: "Article pilier", value: "pilier" }]
              - { label: "Catégorie (identifiant, vide si aucune)", name: "category", widget: "string", required: false }
              - label: "État"
                name: "status"
                widget: "select"
                options: [{ label: "Brouillon (masqué du site)", value: "planned" }, { label: "Publié", value: "published" }]
              - { label: "Adresse (URL) de la page, vide si brouillon", name: "url", widget: "string", required: false }
